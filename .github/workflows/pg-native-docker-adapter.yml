name: pg-native Docker adapter validation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/cart-inventory-verification
    paths:
      - Dockerfile
      - data/staging-test-fixture.js
      - scripts/start-api.js
      - tests/two-role-fixture.test.js
      - .dockerignore
      - .github/workflows/pg-native-docker-adapter.yml
      - data/postgres-pool.js
      - data/inventory-postgres-store.js
      - package.json
      - package-lock.json
      - scripts/db-migrate.js
      - scripts/initialize-staging-test-db.js
      - tests/docker/pg-native/**
      - tests/payment-webhook-postgres.test.js
      - tests/pg-native-channel-binding-poc.test.js
      - tests/postgres-native-adapter.integration.test.js
      - tests/postgres-pool-selection.test.js
      - tests/staging-test-fixture-postgres.test.js

permissions:
  contents: read

jobs:
  docker-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres_major: '16'
            postgres_image: postgres:16.12-bookworm
          - postgres_major: '18'
            postgres_image: postgres:18.6-bookworm
    env:
      CI: 'true'
      NODE_ENV: test
      PG_MAJOR: ${{ matrix.postgres_major }}
      PG_IMAGE: ${{ matrix.postgres_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install host test prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libpq-dev postgresql-client python3 make g++
          pg_config --version
          test "$(pg_config --version | awk '{print $2}' | cut -d. -f1)" -ge 16
          pkg-config --modversion libpq
      - name: Install locked application dependencies
        run: npm ci
      - name: Install Chromium for browser regression
        run: npx playwright install --with-deps chromium
      - name: Run Docker, native adapter, database, security, payment and browser validation
        run: tests/docker/pg-native/validate.sh
        env:
          DATA_DIR: ${{ runner.temp }}/shweta-native-browser-data-${{ matrix.postgres_major }}
          ALLOW_DEMO_CHECKOUT: 'true'
