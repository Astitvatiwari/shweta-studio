name: Staging regression

on:
  push:
    branches: [fix/cart-inventory-verification]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shweta_studio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shweta_studio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      NODE_ENV: test
      PGSSLMODE: disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/shweta_studio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - name: Start disposable TLS PostgreSQL fixture
        run: |
          set -euo pipefail
          tls_dir="$RUNNER_TEMP/shweta-fixture-postgres-tls"
          mkdir -p "$tls_dir"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout "$tls_dir/ca.key" -out "$tls_dir/ca.crt" \
            -subj "/CN=Shweta CI PostgreSQL Test CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -sha256 -nodes \
            -keyout "$tls_dir/server.key" -out "$tls_dir/server.csr" \
            -subj "/CN=localhost"
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\nkeyUsage=digitalSignature,keyEncipherment\n' > "$tls_dir/server.ext"
          openssl x509 -req -sha256 -days 1 -in "$tls_dir/server.csr" \
            -CA "$tls_dir/ca.crt" -CAkey "$tls_dir/ca.key" -CAcreateserial \
            -extfile "$tls_dir/server.ext" -out "$tls_dir/server.crt"
          rm -f "$tls_dir/ca.key" "$tls_dir/server.csr" "$tls_dir/server.ext" "$tls_dir/ca.srl"
          cat > "$tls_dir/Dockerfile" <<'EOF'
          FROM postgres:16
          COPY server.crt /etc/ssl/certs/shweta-ci-postgres.crt
          COPY server.key /etc/ssl/private/shweta-ci-postgres.key
          RUN chown postgres:postgres /etc/ssl/certs/shweta-ci-postgres.crt /etc/ssl/private/shweta-ci-postgres.key \
              && chmod 0644 /etc/ssl/certs/shweta-ci-postgres.crt \
              && chmod 0600 /etc/ssl/private/shweta-ci-postgres.key
          CMD ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/etc/ssl/certs/shweta-ci-postgres.crt", "-c", "ssl_key_file=/etc/ssl/private/shweta-ci-postgres.key"]
          EOF
          docker build --quiet -t shweta-fixture-postgres-tls:ci "$tls_dir"
          docker run --detach --name shweta-fixture-postgres-tls \
            --publish 127.0.0.1:5433:5432 \
            --env POSTGRES_DB=shweta_studio_test \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            shweta-fixture-postgres-tls:ci
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec shweta-fixture-postgres-tls pg_isready -U postgres -d shweta_studio_test >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          export NODE_ENV=production PGSSLMODE=require NODE_EXTRA_CA_CERTS="$tls_dir/ca.crt"
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import { postgresConnectionOptions } from './data/postgres-connection.js';
          const pool = new pg.Pool({
            ...postgresConnectionOptions('postgres://postgres:postgres@localhost:5433/shweta_studio_test'),
            max: 1,
            connectionTimeoutMillis: 5000
          });
          try {
            await pool.query('SELECT 1');
            console.log('Disposable PostgreSQL TLS chain and localhost certificate verification passed.');
          } finally {
            await pool.end();
          }
          NODE
      - name: Run PostgreSQL fixture isolation tests
        run: npm run test:staging-fixture-postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/shweta_studio_test
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/shweta-fixture-postgres-tls/ca.crt
          PGSSLMODE: require
      - run: npx playwright install --with-deps chromium
      - run: node tests/test-complete-verification.js
        env:
          DATA_DIR: ${{ runner.temp }}/shweta-studio-browser-data
          ALLOW_DEMO_CHECKOUT: 'true'
      - name: Stop disposable TLS PostgreSQL fixture
        if: always()
        run: |
          docker rm -f shweta-fixture-postgres-tls >/dev/null 2>&1 || true
          docker image rm shweta-fixture-postgres-tls:ci >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/shweta-fixture-postgres-tls"
          test ! -e "$RUNNER_TEMP/shweta-fixture-postgres-tls"

  postgres18:
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start disposable TLS PostgreSQL 18 fixture
        run: |
          set -euo pipefail
          tls_dir="$RUNNER_TEMP/shweta-fixture-postgres18-tls"
          mkdir -p "$tls_dir"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout "$tls_dir/ca.key" -out "$tls_dir/ca.crt" \
            -subj "/CN=Shweta CI PostgreSQL 18 Test CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout "$tls_dir/wrong-ca.key" -out "$tls_dir/wrong-ca.crt" \
            -subj "/CN=Untrusted Shweta CI Test CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -sha256 -nodes \
            -keyout "$tls_dir/server.key" -out "$tls_dir/server.csr" \
            -subj "/CN=localhost"
          printf 'subjectAltName=DNS:localhost\nextendedKeyUsage=serverAuth\nkeyUsage=digitalSignature,keyEncipherment\n' > "$tls_dir/server.ext"
          cat > "$tls_dir/pg_hba.conf" <<'EOF'
          local all all trust
          hostnossl all all 0.0.0.0/0 reject
          hostnossl all all ::/0 reject
          hostssl all all 0.0.0.0/0 scram-sha-256
          hostssl all all ::/0 scram-sha-256
          EOF
          openssl x509 -req -sha256 -days 1 -in "$tls_dir/server.csr" \
            -CA "$tls_dir/ca.crt" -CAkey "$tls_dir/ca.key" -CAcreateserial \
            -extfile "$tls_dir/server.ext" -out "$tls_dir/server.crt"
          rm -f "$tls_dir/ca.key" "$tls_dir/wrong-ca.key" "$tls_dir/server.csr" "$tls_dir/server.ext" "$tls_dir/ca.srl"
          cat > "$tls_dir/Dockerfile" <<'EOF'
          FROM postgres:18
          COPY server.crt /etc/ssl/certs/shweta-ci-postgres.crt
          COPY server.key /etc/ssl/private/shweta-ci-postgres.key
          COPY pg_hba.conf /etc/postgresql/pg_hba.conf
          RUN chown postgres:postgres /etc/ssl/certs/shweta-ci-postgres.crt /etc/ssl/private/shweta-ci-postgres.key \
              && chmod 0644 /etc/ssl/certs/shweta-ci-postgres.crt \
              && chmod 0600 /etc/ssl/private/shweta-ci-postgres.key \
              && chmod 0644 /etc/postgresql/pg_hba.conf
          CMD ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/etc/ssl/certs/shweta-ci-postgres.crt", "-c", "ssl_key_file=/etc/ssl/private/shweta-ci-postgres.key", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
          EOF
          docker build --quiet -t shweta-fixture-postgres18-tls:ci "$tls_dir"
          docker run --detach --name shweta-fixture-postgres18-tls \
            --publish 127.0.0.1:5433:5432 \
            --env POSTGRES_DB=shweta_studio_test \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            shweta-fixture-postgres18-tls:ci
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec shweta-fixture-postgres18-tls pg_isready -U postgres -d shweta_studio_test >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
      - name: Provision restricted PostgreSQL 18 integration role and database
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { randomBytes } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          import pg from 'pg';
          import { postgresConnectionOptions } from './data/postgres-connection.js';

          const role = 'shweta_pg18_app_test';
          const database = 'shweta_pg18_app_test';
          const password = randomBytes(32).toString('hex');
          const adminUrl = process.env.PG18_ADMIN_DATABASE_URL;
          const admin = new pg.Pool({ ...postgresConnectionOptions(adminUrl, { sslMode: 'require', production: true }), max: 1 });
          const quoteIdentifier = value => `"${value.replaceAll('"', '""')}"`;
          const quoteLiteral = value => `'${value.replaceAll("'", "''")}'`;
          let app;
          try {
            const existing = await admin.query(
              'SELECT (SELECT count(*) FROM pg_roles WHERE rolname=$1)::int AS roles, (SELECT count(*) FROM pg_database WHERE datname=$2)::int AS databases',
              [role, database]
            );
            assert.equal(existing.rows[0].roles + existing.rows[0].databases, 0,
              'refuse to reuse an existing CI test role or database');
            await admin.query(`CREATE ROLE ${quoteIdentifier(role)} LOGIN PASSWORD ${quoteLiteral(password)}
              NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 10`);
            await admin.query(`CREATE DATABASE ${quoteIdentifier(database)} OWNER ${quoteIdentifier(role)}`);
            for (const db of ['shweta_studio_test', 'shweta_pg18_app_test', 'postgres', 'template1']) {
              await admin.query(`REVOKE CONNECT ON DATABASE ${quoteIdentifier(db)} FROM PUBLIC`);
            }

            const appUrl = new URL(adminUrl);
            appUrl.username = role;
            appUrl.password = password;
            appUrl.pathname = `/${database}`;
            app = new pg.Pool({ ...postgresConnectionOptions(appUrl.toString(), { sslMode: 'require', production: true }), max: 1 });
            const identity = await app.query(`SELECT current_database() AS database_name, current_user AS role_name,
              r.rolcanlogin, r.rolsuper, r.rolcreatedb, r.rolcreaterole, r.rolreplication, r.rolbypassrls, r.rolinherit,
              EXISTS (SELECT 1 FROM pg_auth_members m WHERE m.member=r.oid) AS has_memberships
              FROM pg_roles r WHERE r.rolname=current_user`);
            assert.deepEqual(identity.rows[0], {
              database_name: database, role_name: role, rolcanlogin: true, rolsuper: false, rolcreatedb: false,
              rolcreaterole: false, rolreplication: false, rolbypassrls: false,
              rolinherit: false, has_memberships: false
            });
            const wrongDatabase = new URL(appUrl);
            wrongDatabase.pathname = '/shweta_studio_test';
            const denied = new pg.Pool({
              ...postgresConnectionOptions(wrongDatabase.toString(), { sslMode: 'require', production: true }),
              connectionTimeoutMillis: 3000,
              max: 1
            });
            try {
              await assert.rejects(denied.query('SELECT 1'), /permission denied for database/i,
                'restricted role cannot connect to the CI admin database');
            } finally {
              await denied.end();
            }
            appendFileSync(process.env.GITHUB_ENV, `TEST_DATABASE_URL=${appUrl.toString()}\n`);
            console.log('PostgreSQL 18 CI database is owned by a restricted login; other test databases are denied.');
          } finally {
            await app?.end();
            await admin.end();
          }
          NODE
        env:
          PG18_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5433/shweta_studio_test
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/shweta-fixture-postgres18-tls/ca.crt
      - name: Run PostgreSQL 18 migrations and schema coverage
        run: |
          MIGRATION_DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate
          npm run test:db-schema
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/shweta-fixture-postgres18-tls/ca.crt
      - name: Run PostgreSQL 18 concurrency coverage
        run: npm run test:db-concurrency
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/shweta-fixture-postgres18-tls/ca.crt
      - name: Run PostgreSQL 18 webhook verification coverage
        run: npm run test:webhook-postgres
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/shweta-fixture-postgres18-tls/ca.crt
      - name: Verify PostgreSQL 18 TLS chain and hostname rejection
        run: npm run test:db-connection-tls
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/shweta_studio_test
          INVALID_TEST_CA_FILE: ${{ runner.temp }}/shweta-fixture-postgres18-tls/wrong-ca.crt
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/shweta-fixture-postgres18-tls/ca.crt
          PGSSLMODE: require
      - name: Run PostgreSQL 18 staging fixture isolation tests
        run: npm run test:staging-fixture-postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/shweta_studio_test
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/shweta-fixture-postgres18-tls/ca.crt
          PGSSLMODE: require
      - name: Stop disposable TLS PostgreSQL 18 fixture
        if: always()
        run: |
          docker rm -f shweta-fixture-postgres18-tls >/dev/null 2>&1 || true
          docker image rm shweta-fixture-postgres18-tls:ci >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/shweta-fixture-postgres18-tls"
          test ! -e "$RUNNER_TEMP/shweta-fixture-postgres18-tls"
