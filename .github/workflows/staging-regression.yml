name: Staging regression

on:
  push:
    branches: [fix/cart-inventory-verification]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shweta_studio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shweta_studio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      NODE_ENV: test
      PGSSLMODE: disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/shweta_studio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npx playwright install --with-deps chromium
      - run: node tests/test-complete-verification.js
        env:
          DATA_DIR: ${{ runner.temp }}/shweta-studio-browser-data
